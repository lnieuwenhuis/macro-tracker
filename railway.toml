# Repository-root Railway config. Railway applies this to any service that has no
# config-as-code path of its own, so it is NOT safe to treat as "the frontend's
# config" alone - commit 8cac5bea had to add infra/cliproxyapi/railway.toml
# precisely because this file's `pnpm start` was replacing the proxy service's
# container entrypoint and failing that deploy.
#
# Each service therefore points at its own file:
#   /railway.toml                  frontend (@macro-tracker/web), and the fallback
#   /apps/web/railway.toml         frontend, service-scoped
#   /apps/backend/railway.toml     Rust backend
#   /infra/cliproxyapi/railway.toml  proxy
#
# OPS-05 in the audit proposed collapsing the frontend's two copies into one. Do
# not: a service with no scoped config silently inherits this one. Keep them in
# sync instead.

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @macro-tracker/web build"
watchPatterns = [
  "/apps/web/**",
  "/packages/db/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/railpack.json"
]

[deploy]
startCommand = "node apps/web/scripts/start-with-migrations.mjs"
# NOT "/": the session proxy 307-redirects unauthenticated requests, and as of
# 2026-08-31 Railway's healthcheck rejects non-2xx (the 2026-08-19 deploy
# passed with the identical app returning 307 on "/", so the platform
# tightened redirect handling). /login is public and returns 200 while still
# exercising the full Next server + proxy stack.
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
