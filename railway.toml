# Single source of truth for the frontend (@macro-tracker/web) Railway service.
# Do not duplicate this into apps/web/railway.toml - a near-identical copy there
# was removed because the two configs could silently drift out of sync.
# Configure the Rust backend as a separate Railway service using /apps/backend/railway.toml.

[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @macro-tracker/web build"
watchPatterns = [
  "/apps/web/**",
  "/packages/db/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml",
  "/railpack.json"
]

[deploy]
startCommand = "pnpm --filter @macro-tracker/web start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
