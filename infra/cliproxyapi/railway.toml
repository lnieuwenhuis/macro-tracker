# Railway config for the CLIProxyAPI service.
#
# Point this service's Settings -> Config-as-code file path at
# infra/cliproxyapi/railway.toml. Without that, Railway applies the
# repo-root railway.toml (the web service's default), whose
# `pnpm --filter @macro-tracker/web start` start command overrides this
# image's entrypoint and fails with "The executable `pnpm` could not be
# found".

[build]
builder = "DOCKERFILE"
watchPatterns = ["/infra/cliproxyapi/**"]

# No startCommand: the image's entrypoint renders config.yaml from the
# service variables and starts the proxy. No healthcheckPath: CLIProxyAPI
# does not serve the web service's "/" healthcheck.
[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
