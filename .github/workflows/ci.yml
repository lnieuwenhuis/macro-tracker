name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - dev
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/macro_tracker_ci
  TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/macro_tracker_ci
  E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/macro_tracker_ci
  BACKEND_URL: http://127.0.0.1:4000
  BACKEND_INTERNAL_SECRET: macro-tracker-ci-backend-secret-32-chars
  APP_URL: http://localhost:3000
  SESSION_SECRET: macro-tracker-ci-session-secret-32-chars
  SHOO_BASE_URL: https://shoo.dev
  # Enables the test-only role-assignment RPC the Playwright session route needs.
  BACKEND_ENABLE_TEST_ROUTES: true

jobs:
  backend:
    name: Rust backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: macro_tracker_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d macro_tracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.89"
          # Pinning an explicit toolchain drops the rustfmt/clippy the `stable`
          # alias installs by default, so `cargo fmt --check` fails with
          # "'cargo-fmt' is not installed for the toolchain".
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check backend
        run: cargo check -p macro-tracker-backend

      - name: Test backend
        run: cargo test -p macro-tracker-backend

      - name: Verify backend waits for migrations
        run: |
          set +e
          timeout 120s cargo run -p macro-tracker-backend > backend-before-migrations.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            cat backend-before-migrations.log
            echo "Backend should fail quickly before migrations are applied."
            exit 1
          fi
          grep -q "database migrations have not been applied" backend-before-migrations.log
          pnpm --filter @macro-tracker/db exec node <<'NODE'
          const { Pool } = require("pg");
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          (async () => {
            try {
              const result = await pool.query(
                "SELECT COUNT(*)::int AS count FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'",
              );
              const tableCount = Number(result.rows[0].count);
              if (tableCount !== 0) {
                throw new Error(`Backend created ${tableCount} public tables before migrations.`);
              }
            } finally {
              await pool.end();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run database migrations
        run: pnpm --filter @macro-tracker/db db:migrate

      - name: Smoke backend health
        run: |
          # `test-faults` powers the rollback assertions in the db/web suites.
          cargo run -p macro-tracker-backend --features test-faults > backend.log 2>&1 &
          for attempt in {1..180}; do
            if curl -fsS "$BACKEND_URL/health"; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

  web-unit:
    name: Web unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: macro_tracker_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d macro_tracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.89"
          # Pinning an explicit toolchain drops the rustfmt/clippy the `stable`
          # alias installs by default, so `cargo fmt --check` fails with
          # "'cargo-fmt' is not installed for the toolchain".
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @macro-tracker/db db:migrate

      - name: Start Rust backend
        run: |
          # `test-faults` powers the rollback assertions in the db/web suites.
          cargo run -p macro-tracker-backend --features test-faults > backend.log 2>&1 &
          for attempt in {1..180}; do
            if curl -fsS "$BACKEND_URL/health"; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Run web unit tests
        run: pnpm --filter @macro-tracker/web exec vitest run --pool=forks --maxWorkers=1

  db-unit:
    name: DB package tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: macro_tracker_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d macro_tracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.89"
          # Pinning an explicit toolchain drops the rustfmt/clippy the `stable`
          # alias installs by default, so `cargo fmt --check` fails with
          # "'cargo-fmt' is not installed for the toolchain".
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @macro-tracker/db db:migrate

      - name: Start Rust backend
        run: |
          # `test-faults` powers the rollback assertions in the db/web suites.
          cargo run -p macro-tracker-backend --features test-faults > backend.log 2>&1 &
          for attempt in {1..180}; do
            if curl -fsS "$BACKEND_URL/health"; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Run DB package tests
        run: pnpm --filter @macro-tracker/db exec vitest run --pool=forks --maxWorkers=1

  static:
    name: Typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: macro_tracker_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d macro_tracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.89"
          # Pinning an explicit toolchain drops the rustfmt/clippy the `stable`
          # alias installs by default, so `cargo fmt --check` fails with
          # "'cargo-fmt' is not installed for the toolchain".
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @macro-tracker/db db:migrate

      - name: Start Rust backend
        run: |
          # `test-faults` powers the rollback assertions in the db/web suites.
          cargo run -p macro-tracker-backend --features test-faults > backend.log 2>&1 &
          for attempt in {1..180}; do
            if curl -fsS "$BACKEND_URL/health"; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Type-check packages
        run: pnpm typecheck

      - name: Lint web app
        run: pnpm lint

      - name: Build web app
        run: pnpm build

  audit:
    name: Unused code and duplicates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for unused code and duplicates
        run: pnpm audit:code

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_URL: http://localhost:3100
      APP_TRUSTED_ORIGINS: http://localhost:3100
      PLAYWRIGHT_PORT: 3100

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: macro_tracker_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d macro_tracker_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.89"
          # Pinning an explicit toolchain drops the rustfmt/clippy the `stable`
          # alias installs by default, so `cargo fmt --check` fails with
          # "'cargo-fmt' is not installed for the toolchain".
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @macro-tracker/web exec playwright install --with-deps chromium

      - name: Run database migrations
        run: pnpm --filter @macro-tracker/db db:migrate

      - name: Start Rust backend
        run: |
          # `test-faults` powers the rollback assertions in the db/web suites.
          cargo run -p macro-tracker-backend --features test-faults > backend.log 2>&1 &
          for attempt in {1..180}; do
            if curl -fsS "$BACKEND_URL/health"; then
              exit 0
            fi
            sleep 1
          done
          cat backend.log
          exit 1

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  checks:
    name: Tests, build, and browser smoke
    runs-on: ubuntu-latest
    needs:
      - backend
      - web-unit
      - db-unit
      - static
      - audit
      - browser
    if: ${{ always() }}

    steps:
      - name: Fail if any required job failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

      - name: Confirm required jobs passed
        run: echo "All required CI jobs passed."
