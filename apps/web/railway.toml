[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @macro-tracker/web build"
watchPatterns = [
  "/apps/web/**",
  "/packages/db/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml"
]

[deploy]
startCommand = "node apps/web/scripts/start-with-migrations.mjs"
# Kept in sync with /railway.toml — see the comment there for why this is
# /login and must not go back to "/".
healthcheckPath = "/login"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
