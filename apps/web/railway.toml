[build]
builder = "RAILPACK"
buildCommand = "pnpm --filter @macro-tracker/web build"
watchPatterns = [
  "/apps/web/**",
  "/packages/db/**",
  "/package.json",
  "/pnpm-lock.yaml",
  "/pnpm-workspace.yaml"
]

[deploy]
startCommand = "pnpm --filter @macro-tracker/web start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
