[build]
builder = "RAILPACK"
buildCommand = "cargo build --release -p macro-tracker-backend"
watchPatterns = [
  "/apps/backend/**",
  "/Cargo.toml",
  "/Cargo.lock"
]

[deploy]
startCommand = "./target/release/macro-tracker-backend"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
