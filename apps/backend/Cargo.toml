[package]
name = "macro-tracker-backend"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Enables forced-failure injection through the internal RPC. Test-only: never
# enable this on a deployed backend.
test-faults = []

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart"] }
base64ct = { version = "1.6", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "json", "bigdecimal"] }
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["timeout", "trace"] }
# `default-features = false` drops the `tonic` feature, which would otherwise
# pull an entire gRPC stack in for a crate we only use as an axum layer.
tower_governor = { version = "0.8", default-features = false, features = ["axum", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.18", features = ["serde", "v4", "v5"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
